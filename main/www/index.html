<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aRgiModGw</title>
<style>
:root{
  --bg:#0d1117; --panel:#111821; --sidebar:#0f151d;
  --border:#1e2630; --border2:#263140;
  --tx:#e6edf3; --tx2:#7d8896; --tx3:#556270;
  --accent:#2dd4a7; --accent-bg:#12271f; --accent-bd:#1e3a30;
  --amber:#efa127; --red:#e5534b;
  --mono:ui-monospace,'SFMono-Regular','Consolas','Liberation Mono',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;}
body{overflow:hidden;}
input,select,button{font-family:inherit;font-size:14px;}

/* ---------- LOGIN / CHANGE PW ---------- */
.center-wrap{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card-login{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px;width:360px;max-width:100%;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.brand .led{width:11px;height:11px;border-radius:2px;background:var(--accent);box-shadow:0 0 7px var(--accent);}
.brand h1{font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:1px;margin:0;color:var(--tx);}
.fld{margin-bottom:14px;}
.fld label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.5px;color:var(--tx2);margin-bottom:5px;text-transform:uppercase;}
.fld input,.fld select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:9px 11px;color:var(--tx);font-family:var(--mono);}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent);}
.hint{font-size:12px;color:var(--tx3);margin:6px 0 0;}
.btn{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-bd);border-radius:5px;padding:9px 18px;font-family:var(--mono);cursor:pointer;transition:background .15s;}
.btn:hover{background:#173328;}
.btn.full{width:100%;}
.btn.ghost{background:transparent;color:var(--tx2);border-color:var(--border);}
.btn.ghost:hover{background:var(--panel);color:var(--tx);}
.btn.danger{background:#2a1512;color:var(--red);border-color:#3d1e1a;}

/* ---------- APP SHELL: 3 fasce + sidebar ---------- */
#appView{display:none;height:100vh;grid-template-rows:48px 1fr 34px;grid-template-columns:1fr;}
#appView.on{display:grid;}

.header{grid-row:1;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;}
.header .left{display:flex;align-items:center;gap:10px;}
.header .led{width:10px;height:10px;border-radius:2px;background:var(--accent);box-shadow:0 0 6px var(--accent);}
.header .title{font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:1px;}
.header .right{display:flex;align-items:center;gap:8px;}
.hbtn{font-family:var(--mono);font-size:12px;color:var(--tx2);border:1px solid var(--border);padding:5px 9px;border-radius:4px;cursor:pointer;background:transparent;}
.hbtn:hover{color:var(--tx);border-color:var(--border2);}
.hbtn.user{color:var(--accent);border-color:var(--accent-bd);}
.hbtn select{background:transparent;border:none;color:var(--tx2);font-family:var(--mono);font-size:12px;cursor:pointer;}
.hbtn select option{background:var(--panel);}

.middle{grid-row:2;display:grid;grid-template-columns:240px 1fr;min-height:0;}

/* sidebar */
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);overflow-y:auto;padding:8px 0;font-family:var(--mono);font-size:13px;}
.node{display:flex;align-items:center;gap:6px;padding:6px 12px;cursor:pointer;color:var(--tx2);white-space:nowrap;user-select:none;border-left:2px solid transparent;}
.node:hover{background:#131b25;color:var(--tx);}
.node.sel{background:#16212e;color:var(--tx);border-left-color:var(--accent);}
.node .tw{width:14px;display:inline-flex;justify-content:center;flex-shrink:0;color:var(--tx3);}
.node .ico{width:15px;text-align:center;flex-shrink:0;}
.node .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;}
.node .badge{background:#1a2531;color:var(--tx2);font-size:11px;padding:1px 7px;border-radius:3px;min-width:20px;text-align:center;}
.node .badge.on{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-bd);}
.node.add{color:var(--accent);}
.node.add:hover{background:#131b25;}
.node .rh{margin-left:auto;color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:1px 6px;border:1px solid var(--border);border-radius:3px;}
.node.disabled{opacity:.5;}

/* content */
.content{overflow-y:auto;padding:22px 26px;min-width:0;}
.crumb{font-family:var(--mono);font-size:11px;color:var(--tx3);letter-spacing:1px;margin-bottom:5px;text-transform:uppercase;}
.ctitle{font-size:18px;font-weight:500;margin:0 0 20px;color:var(--tx);}
.form-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;max-width:520px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.f label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.5px;color:var(--tx2);margin-bottom:5px;text-transform:uppercase;}
.f input,.f select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:8px 10px;color:var(--tx);font-family:var(--mono);}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent);}
.f .val{color:var(--accent);}
.f.span2{grid-column:1 / -1;}
.actions{margin-top:18px;display:flex;gap:8px;}
.switch{display:flex;gap:6px;}
.switch .opt{flex:1;text-align:center;padding:8px;border:1px solid var(--border2);border-radius:5px;font-family:var(--mono);font-size:13px;cursor:pointer;color:var(--tx2);}
.switch .opt.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-bd);}
.hintbox{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.5;}
.section-lbl{font-family:var(--mono);font-size:11px;color:var(--tx3);letter-spacing:1px;margin:24px 0 8px;text-transform:uppercase;}
.empty{color:var(--tx3);font-family:var(--mono);font-size:13px;padding:10px 0;}

/* footer */
.footer{grid-row:3;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-family:var(--mono);font-size:12px;z-index:10;}
.footer .st{display:flex;align-items:center;gap:8px;}
.footer .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);}
.footer .dot.warn{background:var(--amber);box-shadow:0 0 6px var(--amber);}
.footer .dot.err{background:var(--red);box-shadow:0 0 6px var(--red);}
.footer .msg{color:var(--accent);}
.footer .sub{color:var(--tx3);}
.footer .clock{color:var(--tx3);}

/* toast */
.toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border2);color:var(--tx);padding:9px 16px;border-radius:6px;font-family:var(--mono);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;}
/* modal custom (sostituisce confirm/alert nativi) */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .15s;}
.modal-ov.on{opacity:1;pointer-events:auto;}
.modal-box{background:var(--panel);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:8px;padding:20px 22px;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.5);}
.modal-box.danger{border-left-color:var(--red);}
.modal-title{font-size:15px;color:var(--tx);margin:0 0 10px;font-weight:500;}
.modal-msg{font-family:var(--mono);font-size:13px;color:var(--tx2);line-height:1.5;margin-bottom:18px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}
.toast.show{opacity:1;}
.toast.ok{border-color:var(--accent-bd);color:var(--accent);}
.toast.err{border-color:#3d1e1a;color:var(--red);}
.hidden{display:none!important;}
/* mostra/nascondi password */
.pw-wrap{position:relative;display:block;}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--tx2);font-family:var(--mono);font-size:11px;user-select:none;padding:2px 4px;border:1px solid var(--border);border-radius:3px;background:var(--bg);}
.pw-eye:hover{color:var(--accent);border-color:var(--accent-bd);}
.pw-wrap input{padding-right:44px!important;}
/* ===== Diagnostica ===== */
.diag-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--border);}
.diag-tab{background:transparent;color:var(--tx2);border:1px solid var(--border);border-bottom:none;
  border-radius:6px 6px 0 0;padding:7px 14px;font-family:var(--mono);font-size:12px;cursor:pointer;margin-bottom:-1px;}
.diag-tab:hover{color:var(--tx);}
.diag-tab.active{color:var(--accent);border-color:var(--border2);background:var(--panel);border-bottom:1px solid var(--panel);}
.diag-pane{display:flex;flex-direction:column;gap:12px;}
.diag-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.diag-card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.diag-card-title{font-family:var(--mono);font-weight:600;color:var(--tx);}
.diag-card-extra{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--tx3);}
.diag-chip{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  padding:2px 8px;border-radius:10px;border:1px solid var(--border);}
.diag-on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-bd);}
.diag-off{background:#1a1f27;color:var(--tx3);border-color:var(--border);}
.diag-err{background:#2a1416;color:#f2726b;border-color:#5a2a2a;}
.diag-never{background:#1a1f27;color:var(--tx3);border-color:var(--border);}
.diag-tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;}
.diag-tbl td{padding:3px 6px;border-top:1px solid var(--border);}
.diag-k{color:var(--tx3);width:40%;}
.diag-v{color:var(--tx);}
.diag-sub{font-family:var(--mono);font-size:11px;color:var(--tx3);text-transform:uppercase;
  letter-spacing:.5px;margin:6px 2px 0;}
.diag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.diag-cell{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;}
.diag-cell-name{font-family:var(--mono);font-size:12px;color:var(--tx);}
.diag-cell .diag-chip{margin-left:auto;}
/* --- Dashboard --- */
.dash-info{font-size:13px;opacity:.8;margin:8px 0}
.dash-legend{margin-top:10px;font-size:12px;opacity:.85}
.dash-legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 10px;vertical-align:middle}
.dot-16{background:#3ea36e}.dot-float{background:#d4b23a}.dot-unused{background:#4a7fb5}
.reggrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.reg{padding:3px 4px;border-radius:4px;font-family:monospace;font-size:12px;text-align:center;background:#2a2f3a}
.reg .regidx{display:block;font-size:9px;opacity:.6}
.reg .regval{display:block}
.reg.use16{background:#1e3a2a;border:1px solid #3ea36e}
.reg.regfloat{background:#3a341e;border:1px solid #d4b23a}
.reg.regunused{background:#1e2c3a;border:1px solid #4a7fb5;opacity:.7}
.reg.bit-on{background:#1e3a2a;border:1px solid #3ea36e;color:#3ea36e}
.reg.bit-off{background:#3a1e1e;border:1px solid #a33e3e;color:#a33e3e}
.bitgrid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:6px}
.bitcell{padding:3px 0;border-radius:3px;font-family:monospace;font-size:10px;text-align:center}
.bitcell.bit-on{background:#1e3a2a;border:1px solid #3ea36e;color:#8fd9b0}
.bitcell.bit-off{background:#3a1e1e;border:1px solid #a33e3e;color:#d99f9f}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="center-wrap">
  <div class="card-login">
    <div class="brand"><span class="led"></span><h1>aRgiModGw</h1></div>
    <div class="fld"><label data-i18n="language">Language</label>
      <select id="loginLang" onchange="onLoginLangChange()"></select></div>
    <div class="fld"><label data-i18n="user">User</label>
      <input id="loginUser" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="fld"><label data-i18n="password">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn full" onclick="doLogin()" data-i18n="login">Login</button>
  </div>
</div>

<!-- CHANGE PASSWORD -->
<div id="chpwView" class="center-wrap hidden">
  <div class="card-login">
    <div class="brand"><span class="led"></span><h1 data-i18n="change_password">Change password</h1></div>
    <p class="hint" data-i18n="must_change_hint">You must change the initial password.</p>
    <div class="fld"><label data-i18n="language">Language</label>
      <select id="chpwLang" onchange="onChpwLangChange()"></select></div>
    <div class="fld"><label data-i18n="current_password">Current password</label>
      <input id="cpOld" type="password"></div>
    <div class="fld"><label data-i18n="new_password">New password</label>
      <input id="cpNew" type="password"></div>
    <div class="fld"><label data-i18n="confirm_password">Confirm new password</label>
      <input id="cpNew2" type="password"></div>
    <p class="hint" data-i18n="pw_rules">Min 8 characters, with uppercase, number and special character.</p>
    <button class="btn full" onclick="doChangePw()" data-i18n="save">Save</button>
  </div>
</div>

<!-- APP -->
<div id="appView">
  <div class="header">
    <div class="left"><span class="led"></span><span class="title">aRgiModGw</span></div>
    <div class="right">
      <span class="hbtn"><select id="hdrLang" onchange="onHdrLangChange()"></select></span>
      <span class="hbtn user" id="whoami" onclick="openProfile()">admin</span>
      <span class="hbtn" onclick="doLogout()" data-i18n="logout">Logout</span>
    </div>
  </div>

  <div class="middle">
    <div class="sidebar" id="tree"></div>
    <div class="content" id="content"></div>
  </div>

  <div class="footer">
    <div class="st"><span class="dot" id="fdot"></span><span class="msg" id="fmsg">—</span><span class="sub" id="fsub"></span></div>
    <span class="clock" id="fclock"></span>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="modalOv" class="modal-ov"><div class="modal-box" id="modalBox"></div></div>

/* ============ STATO GLOBALE ============ */
let curLang = 'en';
let curRole = 0;          // 0=none 1=user 2=admin
// Timer di inattivita' locale: la sessione UI scade dopo 5 min senza attivita'
// utente (mouse/tastiera). Il footer controlla questo prima di chiamare le API,
// cosi' il polling passivo non tiene viva la sessione.
const INACTIVITY_MS = 5 * 60 * 1000;   // 5 minuti
let lastActivity = Date.now();
let inactivityTimer = null;
// Finestra di grazia dopo un login riuscito: per un breve periodo un 401 NON
// e' una scadenza vera, ma la transizione del cookie di sessione (il browser
// deve applicare il nuovo SID prima che le chiamate successive lo usino; il
// backend rigenera il token al re-login, quindi il vecchio cookie da' 401 per
// un istante). In questa finestra ignoriamo il 401 invece di cacciare l'utente.
const LOGIN_GRACE_MS = 4000;
let justLoggedInAt = 0;
function markJustLoggedIn(){ justLoggedInAt = Date.now(); }
function inLoginGrace(){ return (Date.now() - justLoggedInAt) < LOGIN_GRACE_MS; }
function markActivity(){ lastActivity = Date.now(); }
function sessionExpiredLocally(){ return (Date.now() - lastActivity) > INACTIVITY_MS; }
function startInactivityWatch(){
  markActivity();
  const evs=['mousemove','mousedown','keydown','touchstart','click'];
  evs.forEach(ev=>document.removeEventListener(ev, markActivity));   // evita duplicati
  evs.forEach(ev=>document.addEventListener(ev, markActivity, {passive:true}));
  if(inactivityTimer) clearInterval(inactivityTimer);
  inactivityTimer = setInterval(()=>{
    if(sessionExpiredLocally()){ handleSessionExpired(); }
  }, 15000);   // controllo ogni 15s
}
function stopInactivityWatch(){
  if(inactivityTimer){ clearInterval(inactivityTimer); inactivityTimer=null; }
  ['mousemove','mousedown','keydown','touchstart','click'].forEach(ev=>
    document.removeEventListener(ev, markActivity));
}

let curUser = '';

  ports: [ null, null ],   // ports[0]=COM1, ports[1]=COM2 : {role,serial,response_tout_ms,device_count}
  slave_tcp: null,         // {enabled,tcp_port,unit_id}
  master_tcp: null,        // {enabled,device_count}
  // device/blocchi caricati on-demand per target
  devices: { com1:[], com2:[], tcp:[] },   // liste device per target
  blocks:  {}              // chiave "target/deviceId" -> lista blocchi
};

  if(role==='master') return 'Master';

}

// Aggiunge l'icona mostra/nascondi a ogni campo password non ancora processato.
function attachPasswordToggles(){
  document.querySelectorAll('input[type="password"]').forEach(inp=>{
    if(inp.dataset.pwToggle) return;
    inp.dataset.pwToggle='1';
    const wrap=document.createElement('span'); wrap.className='pw-wrap';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const eye=document.createElement('span'); eye.className='pw-eye'; eye.textContent=t('pw_show');
    eye.onclick=()=>{
      if(inp.type==='password'){ inp.type='text'; eye.textContent=t('pw_hide'); }
      else { inp.type='password'; eye.textContent=t('pw_show'); }
    };
    wrap.appendChild(eye);
  });
}

/* ============ API + UTIL ============ */
async function api(method, path, body){
  const opt={method, headers:{}};
  if(body!==undefined){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const r=await fetch(path, opt);

  // Sessione scaduta / non autenticato -> torna al login (pulito).
  // ECCEZIONE: subito dopo un login riuscito, un 401 e' quasi sempre la
  // transizione del cookie (vedi LOGIN_GRACE_MS), non una scadenza vera: non
  // cacciare l'utente, lascia fallire la chiamata e il footer riprovera'.
  if(r.status===401){
    if(!inLoginGrace()){ handleSessionExpired(); }
    throw new Error('unauthorized');
  }

  // Il body puo' non essere JSON (es. messaggi di errore httpd come
  // "Specified method is invalid for this resource"): non assumere JSON.
  let data=null, txt='';
  try{ txt=await r.text(); }catch(e){}
  if(txt){ try{ data=JSON.parse(txt); }catch(e){ data=null; } }

  if(!r.ok){
    const msg=(data&&data.error)?data.error:(txt||('error '+r.status));
    throw new Error(msg);
  }
  return data;
}
// Sessione scaduta: ferma il footer e riporta alla pagina di login.
function handleSessionExpired(){
  if(handleSessionExpired._done) return;   // una sola volta
  handleSessionExpired._done=true;
  stopFooter();
  stopInactivityWatch();
  show('loginView');
  setTimeout(()=>{ handleSessionExpired._done=false; }, 3000);
}
function toast(msg, kind){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show '+(kind||'');
  setTimeout(()=>{ el.className='toast'; }, 2600);
}
// Modal di conferma: ritorna una Promise<bool> (sostituisce confirm() nativo).
function confirmModal(msg, opts){
  opts=opts||{};
  return new Promise(resolve=>{
    const ov=document.getElementById('modalOv');
    const box=document.getElementById('modalBox');
    box.className='modal-box'+(opts.danger?' danger':'');
    box.innerHTML='';
    if(opts.title){ const h=el('div','modal-title',opts.title); box.appendChild(h); }
    box.appendChild(el('div','modal-msg',msg));
    const act=el('div','modal-actions');
    const cancel=el('button','btn ghost',opts.cancelLabel||t('cancel'));
    const ok=el('button','btn'+(opts.danger?' danger':''),opts.okLabel||t('confirm_btn'));
    const close=(val)=>{ ov.className='modal-ov'; resolve(val); };
    cancel.onclick=()=>close(false);
    ok.onclick=()=>close(true);
    act.appendChild(cancel); act.appendChild(ok); box.appendChild(act);
    ov.className='modal-ov on';
  });
}
function show(id){
  ['loginView','chpwView'].forEach(v=>document.getElementById(v).classList.add('hidden'));
  document.getElementById('appView').classList.remove('on');
  if(id==='appView'){ document.getElementById('appView').classList.add('on'); }
  else{ document.getElementById(id).classList.remove('hidden'); }
  setTimeout(attachPasswordToggles,0);
}
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

/* ============ LOGIN / LOGOUT / PROFILE ============ */
async function doLogin(){
  const username=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;
  try{
    const r=await api('POST','/api/login',{username,password});
    markJustLoggedIn();   // avvia la finestra di grazia (transizione cookie)
    curRole=r.role; curUser=username;
    if(r.must_change){ fillLangSelect(document.getElementById('chpwLang'),curLang); show('chpwView'); }
    else{ await enterApp(username); }
  }catch(e){ toast(e.message,'err'); }
}
async function doChangePw(){
  const oldp=document.getElementById('cpOld').value;
  const np=document.getElementById('cpNew').value;
  const np2=document.getElementById('cpNew2').value;
  if(np!==np2){ toast(t('pw_mismatch'),'err'); return; }
  try{
    await api('POST','/api/change_password',{old_password:oldp,new_password:np});
    toast(t('pw_changed'),'ok');
    setTimeout(()=>{ show('loginView'); }, 1200);
  }catch(e){ toast(e.message,'err'); }
}
async function doLogout(){ try{ await api('POST','/api/logout'); }catch(e){} stopFooter(); stopDiag(); stopInactivityWatch(); show('loginView'); }
function openProfile(){ /* placeholder: cambio password da loggati - futuro */ toast(curUser+(curRole>=2?' (admin)':' (user)')); }

async function enterApp(username){
  markActivity();                  // sessione "fresca" SUBITO (il primo pollFooter
                                   // non deve vedere lastActivity vecchio)
  handleSessionExpired._done=false;// reset flag scadenza dopo login riuscito
  document.getElementById('whoami').textContent = username + (curRole>=2?' (admin)':' (user)');
  fillLangSelect(document.getElementById('hdrLang'), curLang);
  show('appView');
  applyI18n();
  await loadTopology();
  collapseAllTree();               // rami sidebar tutti chiusi al login
  SEL={ kind:'dashboard' };        // landing: Dashboard
  render();
  startFooter();
  startInactivityWatch();
}

/* ============ CARICAMENTO TOPOLOGIA ============ */
// Carica lo stato dei 4 canali (porte + TCP) per costruire l'albero.
async function loadTopology(){
  try{
    const [p0,p1,stcp,mtcp]=await Promise.all([
      api('GET','/api/port?port=com1'),
      api('GET','/api/port?port=com2'),
      api('GET','/api/slave_tcp'),
      api('GET','/api/master_tcp')
    ]);
    M.ports[0]=p0; M.ports[1]=p1; M.slave_tcp=stcp; M.master_tcp=mtcp;
    // Carica i device dei master (per i badge e i figli albero)
    await Promise.all([
      M.ports[0].role==='master' ? loadDevices('com1') : Promise.resolve(),
      M.ports[1].role==='master' ? loadDevices('com2') : Promise.resolve(),
      M.master_tcp.enabled ? loadDevices('tcp') : Promise.resolve()
    ]);
  }catch(e){ toast(e.message,'err'); }
}
async function loadDevices(target){
  try{ M.devices[target]=await api('GET','/api/devices?target='+target)||[]; }
  catch(e){ M.devices[target]=[]; }
  // carica i blocchi di ogni device (per i badge)
  for(const d of M.devices[target]){
    await loadBlocks(target, d.id);
  }
}
async function loadBlocks(target, devId){
  try{ M.blocks[target+'/'+devId]=await api('GET','/api/block?target='+target+'&device='+devId)||[]; }
  catch(e){ M.blocks[target+'/'+devId]=[]; }
}

/* ============ RENDER ALBERO ============ */
function icon(name){
  // semplici glifi unicode come icone (no dipendenze esterne)
  const I={ plug:'\u25A0', net:'\u25C9', server:'\u25A3', cpu:'\u25A6',
            master:'\u25C6', chev_open:'\u25BE', chev_closed:'\u25B8',
            block:'\u2022', add:'+' };
  return I[name]||'';
}
function nodeRow(opts){
  // opts: {depth, icon, label, badge, badgeOn, sel, twist(bool|null), onclick, cls, roleHint}
  const n=el('div','node'+(opts.sel?' sel':'')+(opts.cls?' '+opts.cls:''));
  n.style.paddingLeft=(8+opts.depth*16)+'px';
  const tw=el('span','tw');
  if(opts.twist===true) tw.textContent=icon('chev_open');
  else if(opts.twist===false) tw.textContent=icon('chev_closed');
  n.appendChild(tw);
  // (icone rimosse dai nodi: solo freccia di espansione + testo)
  const lbl=el('span','lbl',opts.label); n.appendChild(lbl);
  if(opts.roleHint){ const rh=el('span','rh',opts.roleHint); n.appendChild(rh); }
  if(opts.badge!=null){ const b=el('span','badge'+(opts.badgeOn?' on':''),String(opts.badge)); n.appendChild(b); }
  if(opts.onclick) n.onclick=opts.onclick;
  return n;
}

function renderTree(){
  const tree=document.getElementById('tree'); tree.innerHTML='';

  // --- Dashboard: nodo primario in cima (landing dopo login), visibile a tutti ---
  tree.appendChild(nodeRow({
    depth:0, label:t('dashboard'),
    sel: SEL.kind==='dashboard',
    onclick:()=>{ SEL={kind:'dashboard'}; render(); }
  }));
  { const sp=el('div'); sp.style.borderTop='1px solid var(--border)'; sp.style.margin='8px 12px'; tree.appendChild(sp); }

  // --- Diagnostica: nodo primario (sotto Dashboard), visibile a tutti ---
  tree.appendChild(nodeRow({
    depth:0, label:t('diagnostics'),
    sel: SEL.kind==='diag',
    onclick:()=>{ SEL={kind:'diag'}; render(); }
  }));
  { const sp=el('div'); sp.style.borderTop='1px solid var(--border)'; sp.style.margin='8px 12px'; tree.appendChild(sp); }
  for(let pi=0; pi<2; pi++){
    const port=M.ports[pi]; const target=TARGETS[pi];
    const isMaster = port && port.role==='master';
    const devs=M.devices[target]||[];
    // COM espandibile SOLO se master (ha slave sotto), come Master TCP.
    // Se slave o none -> nodo semplice, roleHint capitalizzato.
    tree.appendChild(nodeRow({
      depth:0,
      label:'COM'+(pi+1),
      badge: isMaster? devs.length : null, badgeOn:true,
      twist: isMaster ? (EXP[target]!==false?true:false) : null,
      roleHint: (port && !isMaster) ? capRole(port.role) : '',
      sel: SEL.kind==='port' && SEL.port===pi,
      onclick:()=>{ SEL={kind:'port',port:pi}; render(); }
    }));
    if(isMaster){
      const last=tree.lastChild;
      last.querySelector('.tw').onclick=(ev)=>{ ev.stopPropagation(); EXP[target]=(EXP[target]===false); renderTree(); };
    }

    // Se master ed espansa: gli slave appaiono DIRETTAMENTE sotto COM (depth 1).
    if(isMaster && EXP[target]!==false){
      devs.forEach((d,ix)=>{
        const blocks=M.blocks[target+'/'+d.id]||[];
        const ekey=target+'/'+d.id;
        tree.appendChild(nodeRow({
          depth:1,
          label:d.name||('Slave '+(ix+1)),
          badge:blocks.length,
          twist: blocks.length? (EXP[ekey]!==false?true:false):null,
          sel: SEL.kind==='device' && SEL.target===target && SEL.devId===d.id,
          onclick:()=>{ SEL={kind:'device',target:target,devId:d.id}; render(); }
        }));
        if(blocks.length){
          const last=tree.lastChild;
          last.querySelector('.tw').onclick=(ev)=>{ ev.stopPropagation(); EXP[ekey]=(EXP[ekey]===false); renderTree(); };
        }
        if(EXP[ekey]!==false){
          blocks.forEach((b,bx)=>{
            tree.appendChild(nodeRow({
              depth:2,
              label:b.name||('block '+b.id),
              sel: SEL.kind==='block' && SEL.target===target && SEL.devId===d.id && SEL.blockId===b.id,
              onclick:()=>{ SEL={kind:'block',target:target,devId:d.id,blockId:b.id}; render(); }
            }));
          });
          tree.appendChild(nodeRow({
            depth:2, label:t('add_block'), cls:'add',
            onclick:()=>addBlock(target,d.id)
          }));
        }
      });
      tree.appendChild(nodeRow({
        depth:1, label:t('add_device'), cls:'add',
        onclick:()=>addDevice(target)
      }));
    }
  }

  // --- Master TCP ---
  const mtcpDevs=M.devices['tcp']||[];
  const mEnabled=M.master_tcp&&M.master_tcp.enabled;
  tree.appendChild(nodeRow({
    depth:0, label:'Master TCP',
    badge: mEnabled? mtcpDevs.length : null, badgeOn:true,
    twist: mEnabled&&mtcpDevs.length? (EXP.tcpM!==false?true:false):null,
    roleHint: mEnabled? '' : 'off',
    cls: mEnabled?'':'disabled',
    sel: SEL.kind==='mastertcp',
    onclick:()=>{ SEL={kind:'mastertcp'}; render(); }
  }));
  if(mEnabled&&mtcpDevs.length){
    const last=tree.lastChild;
    last.querySelector('.tw').onclick=(ev)=>{ ev.stopPropagation(); EXP.tcpM=(EXP.tcpM===false); renderTree(); };
  }
  if(mEnabled&&EXP.tcpM!==false){
    mtcpDevs.forEach((d,ix)=>{
      const blocks=M.blocks['tcp/'+d.id]||[];
      const ekey='tcp/'+d.id;
      tree.appendChild(nodeRow({
        depth:1, label:d.name||('Device '+(ix+1)),
        badge:blocks.length,
        twist: blocks.length? (EXP[ekey]!==false?true:false):null,
        sel: SEL.kind==='device' && SEL.target==='tcp' && SEL.devId===d.id,
        onclick:()=>{ SEL={kind:'device',target:'tcp',devId:d.id}; render(); }
      }));
      if(blocks.length){
        const last=tree.lastChild;
        last.querySelector('.tw').onclick=(ev)=>{ ev.stopPropagation(); EXP[ekey]=(EXP[ekey]===false); renderTree(); };
      }
      if(EXP[ekey]!==false){
        blocks.forEach(b=>{
          tree.appendChild(nodeRow({
            depth:2, label:b.name||('block '+b.id),
            sel: SEL.kind==='block' && SEL.target==='tcp' && SEL.devId===d.id && SEL.blockId===b.id,
            onclick:()=>{ SEL={kind:'block',target:'tcp',devId:d.id,blockId:b.id}; render(); }
          }));
        });
        tree.appendChild(nodeRow({ depth:2, label:t('add_block'), cls:'add',
          onclick:()=>addBlock('tcp',d.id) }));
      }
    });
    tree.appendChild(nodeRow({ depth:1, label:t('add_device'), cls:'add',
      onclick:()=>addDevice('tcp') }));
  }

  // --- Slave TCP ---
  tree.appendChild(nodeRow({
    depth:0, label:'Slave TCP',

    sel: SEL.kind==='slavetcp',

  // --- Nodo SISTEMA (solo admin): contenitore per WiFi/Users/Configurazione/Firmware ---
  if(curRole>=2){
    const sep=el('div'); sep.style.borderTop='1px solid var(--border)'; sep.style.margin='8px 12px';
    tree.appendChild(sep);

    // Sistema (espandibile)
    tree.appendChild(nodeRow({
      depth:0, label:t('system'),

    { const last=tree.lastChild; last.querySelector('.tw').onclick=(ev)=>{ ev.stopPropagation(); EXP.sys=(EXP.sys===false); renderTree(); }; }

    if(EXP.sys!==false){

      // Users (espandibile: admin + operator)
      tree.appendChild(nodeRow({
        depth:1, label:t('users'),

      { const last=tree.lastChild; last.querySelector('.tw').onclick=(ev)=>{ ev.stopPropagation(); EXP.users=(EXP.users===false); renderTree(); }; }
      if(EXP.users!==false){
        tree.appendChild(nodeRow({ depth:2, label:t('user_admin'),
          sel: SEL.kind==='user' && SEL.who==='admin',
          onclick:()=>{ SEL={kind:'user',who:'admin'}; render(); } }));
        tree.appendChild(nodeRow({ depth:2, label:t('user_operator'),

      // Configurazione (espandibile: Export, Import)
      tree.appendChild(nodeRow({
        depth:1, label:t('configuration'),
        twist: EXP.cfg!==false?true:false,
        sel: SEL.kind==='configRoot',
        onclick:()=>{ SEL={kind:'configRoot'}; render(); }
      }));
      { const last=tree.lastChild; last.querySelector('.tw').onclick=(ev)=>{ ev.stopPropagation(); EXP.cfg=(EXP.cfg===false); renderTree(); }; }
      if(EXP.cfg!==false){
        tree.appendChild(nodeRow({ depth:2, label:t('export'),
          sel: SEL.kind==='export', onclick:()=>{ SEL={kind:'export'}; render(); } }));
        tree.appendChild(nodeRow({ depth:2, label:t('import'),
          sel: SEL.kind==='import', onclick:()=>{ SEL={kind:'import'}; render(); } }));
      }

      // Firmware upgrade (foglia, segnaposto)
      tree.appendChild(nodeRow({
        depth:1, label:t('firmware_upgrade'),
        sel: SEL.kind==='firmware',
        onclick:()=>{ SEL={kind:'firmware'}; render(); }
      }));

      // Log levels (foglia, solo admin)
      tree.appendChild(nodeRow({
        depth:1, label:t('logs_title'),
        sel: SEL.kind==='logs',
        onclick:()=>{ SEL={kind:'logs'}; render(); }
      }));

      // Settings (foglia, solo admin): NTP / ora / timezone
      tree.appendChild(nodeRow({
        depth:1, label:t('settings_title'),
        sel: SEL.kind==='settings',
        onclick:()=>{ SEL={kind:'settings'}; render(); }
      }));

      // Event Log (foglia): registro eventi
      tree.appendChild(nodeRow({
        depth:1, label:t('eventlog_title'),
        sel: SEL.kind==='eventlog',
        onclick:()=>{ SEL={kind:'eventlog'}; render(); }
      }));

      // Sicurezza (foglia, solo admin): protocollo web HTTP/HTTPS
      tree.appendChild(nodeRow({
        depth:1, label:t('security_title'),
        sel: SEL.kind==='security',
        onclick:()=>{ SEL={kind:'security'}; render(); }
      }));

      // Maintenance (foglia): riavvio + funzioni future
      tree.appendChild(nodeRow({
        depth:1, label:t('maintenance'),
        sel: SEL.kind==='maintenance',
        onclick:()=>{ SEL={kind:'maintenance'}; render(); }
      }));
    }
  }
}

// Costruisce un selettore file "tradotto": il file input nativo del browser
// mostra un testo non controllabile (dipende dalla lingua del browser), quindi
// lo nascondiamo e usiamo un pulsante nostro (i18n) + il nome del file scelto.
function filePicker(id, accept){
  const wrap=el('div','f span2');
  const inp=el('input'); inp.type='file'; inp.id=id; inp.accept=accept;
  inp.style.display='none';
  const row=el('div'); row.style.display='flex'; row.style.alignItems='center'; row.style.gap='10px';
  const btn=el('button','btn ghost',t('choose_file')); btn.type='button';
  const name=el('span',null,t('no_file_selected'));
  name.style.fontFamily='var(--mono)'; name.style.fontSize='12px'; name.style.color='var(--tx2)';
  btn.onclick=()=>inp.click();
  inp.onchange=()=>{ name.textContent = inp.files.length? inp.files[0].name : t('no_file_selected'); };
  row.appendChild(btn); row.appendChild(name);
  wrap.appendChild(inp); wrap.appendChild(row);
  return wrap;
}

function fieldInput(id, label, value, opts){
  opts=opts||{};
  const f=el('div','f'+(opts.span2?' span2':''));
  const l=el('label',null,label); f.appendChild(l);
  let inp;
  if(opts.select){
    inp=el('select'); inp.id=id;
    opts.select.forEach(o=>{ const op=el('option',null,o.label); op.value=o.value; if(String(o.value)===String(value))op.selected=true; inp.appendChild(op); });
  }else{
    inp=el('input'); inp.id=id; inp.value=(value!=null?value:'');
    if(opts.type) inp.type=opts.type;
    if(opts.maxlen) inp.maxLength=opts.maxlen;
  }
  f.appendChild(inp);
  return f;
}
function crumb(txt){ return document.createComment('no-breadcrumb'); }
function titleEl(txt){ const h=el('h2','ctitle',txt); return h; }

function renderContent(){
  const c=document.getElementById('content'); c.innerHTML='';
  if(SEL.kind!=='diag'){ stopDiag(); }   // ferma l'auto-refresh diag se si lascia la pagina
  if(SEL.kind!=='dashboard' && DASH.timer){ clearInterval(DASH.timer); DASH.timer=null; }  // idem dashboard
  switch(SEL.kind){
    case 'dashboard':  return renderDashboard(c);
    case 'diag':       return renderDiag(c);
    case 'port':       return renderPortForm(c, SEL.port);
    case 'device':     return renderDeviceForm(c, SEL.target, SEL.devId);
    case 'block':      return renderBlockForm(c, SEL.target, SEL.devId, SEL.blockId);
    case 'slavetcp':   return renderSlaveTcp(c);
    case 'mastertcp':  return renderMasterTcp(c);
    case 'wifi':       return renderWifi(c);
    case 'systemRoot': return renderSystemRoot(c);
    case 'firmware':   return renderFirmware(c);
    case 'logs':       return renderLogs(c);
    case 'settings':   return renderSettings(c);
    case 'security':   return renderSecurity(c);
    case 'eventlog':   return renderEventLog(c);
    case 'maintenance':return renderMaintenance(c);
    case 'usersRoot':  return renderUsersRoot(c);
    case 'user':       return renderUserForm(c, SEL.who);
    case 'configRoot': return renderConfigRoot(c);
    case 'export':     return renderExport(c);
    case 'import':     return renderImport(c);
  }
}

/* ============ DIAGNOSTICA (5 tab: Generale + 4 controller) ============ */
let diagTimer=null;
let diagTab='general';   // tab attiva: general|com1|com2|master_tcp|slave_tcp
let diagData=null;       // ultimo JSON ricevuto da /api/diag
const DIAG_REFRESH_MS=4000;

function stopDiag(){ if(diagTimer){ clearInterval(diagTimer); diagTimer=null; } }

// Chip di stato colorato in base ai flag dell'entita'.
function diagStatusChip(e){
  let cls='off', txt='offline';
  if(!e || !e.enabled){ cls='off'; txt=t('diag_disabled'); }
  else if(e.online){ cls='on'; txt='online'; }
  else if(e.never){ cls='never'; txt=t('diag_never'); }
  else if(e.offline_stable){ cls='err'; txt=t('diag_offline'); }
  else if(e.error){ cls='err'; txt='error'; }
  else { cls='off'; txt='offline'; }
  const s=el('span','diag-chip diag-'+cls); s.textContent=txt; return s;
}

// Tabella dei dettagli di una singola entita' (controller o device).
function diagEntityTable(e){
  const tbl=el('table','diag-tbl');
  const rows=[
    ['in / out', (e.msg_in||0)+' / '+(e.msg_out||0)],
    [t('diag_errors'), e.err_count||0],
    ['latency', (e.latency_ms||0)+' ms'],
    [t('diag_last_comm'), (e.last_comm_s>0? e.last_comm_s+' s' : (e.online?'now':'—'))],
    ['reconnects', e.reconnects||0],
  ];
  if(e.last_err){ rows.push(['last err','0x'+(e.last_err).toString(16)]); }
  for(const [k,v] of rows){
    const tr=el('tr');
    const td1=el('td','diag-k'); td1.textContent=k;
    const td2=el('td','diag-v'); td2.textContent=v;
    tr.appendChild(td1); tr.appendChild(td2); tbl.appendChild(tr);
  }
  return tbl;
}

// Card di una entita' con titolo, chip di stato e tabella.
function diagEntityCard(title, e, extra){
  const card=el('div','diag-card');
  const head=el('div','diag-card-head');
  const ttl=el('span','diag-card-title'); ttl.textContent=title;
  head.appendChild(ttl);
  head.appendChild(diagStatusChip(e));
  if(extra){ const ex=el('span','diag-card-extra'); ex.textContent=extra; head.appendChild(ex); }
  card.appendChild(head);
  card.appendChild(diagEntityTable(e));
  return card;
}

// Contenuto della tab di un controller: la card del controller + i suoi device.
function diagControllerPane(pane, ctrlKey, ctrlLabel){
  const d=diagData ? diagData[ctrlKey] : null;
  if(!d){ pane.appendChild(el('div','hintbox', t('diag_loading'))); return; }
  const extra=(d.dev_on!==undefined) ? ('device: '+d.dev_on+' on, '+d.dev_off+' off') : '';
  pane.appendChild(diagEntityCard(ctrlLabel, d, extra));
  const devs=d.devices||[];
  if(devs.length){
    pane.appendChild(el('div','diag-sub', t('diag_devices')));
    devs.forEach(dev=>{
      pane.appendChild(diagEntityCard(dev.label||('#'+dev.index), dev));
    });
  } else if(d.dev_on!==undefined){
    pane.appendChild(el('div','hintbox', t('diag_no_devices')));
  }
}

// Tab "Generale": metriche di sistema + riepilogo semaforo dei 4 controller.
function diagGeneralPane(pane){
  const d=diagData;
  if(!d){ pane.appendChild(el('div','hintbox', t('diag_loading'))); return; }
  const sys=d.system||{};
  // metriche sistema
  const card=el('div','diag-card');
  const head=el('div','diag-card-head');
  const ttl=el('span','diag-card-title'); ttl.textContent=t('diag_system'); head.appendChild(ttl);
  card.appendChild(head);
  const tbl=el('table','diag-tbl');
  const kib=(b)=>Math.round((b||0)/1024)+' KiB';
  const up=(s)=>{ s=s||0; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
    return (h? h+'h ':'')+(m? m+'m ':'')+ss+'s'; };
  // RSSI: dBm + etichetta qualita' (>-60 ottimo, -70 buono, -80 debole, else scarso).
  const rssiTxt=(r)=>{
    if(!r || r===0) return '—';
    let q = r>=-60? t('rssi_excellent') : r>=-70? t('rssi_good') : r>=-80? t('rssi_weak') : t('rssi_poor');
    return r+' dBm ('+q+')';
  };
  const rows=[
    [t('diag_version'), (sys.fw_version||'?')+(sys.fw_build? ' ('+sys.fw_build+')':'')],
    [t('diag_heap'), kib(sys.heap_free)+' ('+t('diag_min')+' '+kib(sys.heap_min)+')'],
    [t('diag_uptime'), up(sys.uptime_s)],
    ['WiFi', sys.sta_connected? t('diag_connected') : t('diag_disconnected')],
    [t('diag_rssi'), rssiTxt(sys.wifi_rssi)],
    [t('diag_reconnects'), (sys.wifi_reconnects!=null? sys.wifi_reconnects : '—')],
    [t('diag_restarts'), (sys.master_restarts!=null? sys.master_restarts : '—')],
  ];
  for(const [k,v] of rows){
    const tr=el('tr'); const a=el('td','diag-k'); a.textContent=k;
    const b=el('td','diag-v'); b.textContent=v; tr.appendChild(a); tr.appendChild(b); tbl.appendChild(tr);
  }
  card.appendChild(tbl);
  pane.appendChild(card);
  // riepilogo semaforo controller
  pane.appendChild(el('div','diag-sub', t('diag_controllers')));
  const grid=el('div','diag-grid');
  [['com1','COM1'],['com2','COM2'],['master_tcp','Master TCP'],['slave_tcp','Slave TCP']].forEach(([k,lbl])=>{
    const e=d[k]; const cell=el('div','diag-cell');
    const nm=el('span','diag-cell-name'); nm.textContent=lbl; cell.appendChild(nm);
    cell.appendChild(diagStatusChip(e));
    grid.appendChild(cell);
  });
  pane.appendChild(grid);
}

function renderDiagPane(){
  const pane=document.getElementById('diagPane');
  if(!pane) return;
  pane.innerHTML='';
  switch(diagTab){
    case 'general':    diagGeneralPane(pane); break;
    case 'com1':       diagControllerPane(pane,'com1','COM1'); break;
    case 'com2':       diagControllerPane(pane,'com2','COM2'); break;
    case 'master_tcp': diagControllerPane(pane,'master_tcp','Master TCP'); break;
    case 'slave_tcp':  diagControllerPane(pane,'slave_tcp','Slave TCP'); break;
  }
}

async function diagFetch(){
  try{
    diagData=await api('GET','/api/diag');
    renderDiagPane();
  }catch(e){ /* la connessione puo' cadere: si ritenta al giro successivo */ }
}

function renderDiag(c){
  c.innerHTML='';
  c.appendChild(titleEl(t('diagnostics')));

  // barra tab
  const tabs=el('div','diag-tabs');
  const TABDEF=[['general',t('diag_general')],['com1','COM1'],['com2','COM2'],
                ['master_tcp','Master TCP'],['slave_tcp','Slave TCP']];
  TABDEF.forEach(([key,lbl])=>{
    const b=el('button','diag-tab'+(diagTab===key?' active':''));
    b.textContent=lbl;
    b.onclick=()=>{ diagTab=key; renderDiag(c); };
    tabs.appendChild(b);
  });
  c.appendChild(tabs);

  // contenitore del pannello attivo
  const pane=el('div'); pane.id='diagPane'; pane.className='diag-pane';
  c.appendChild(pane);

  // Auto-refresh SOLO mentre questa pagina e' aperta (leggero: una sola richiesta
  // ogni DIAG_REFRESH_MS, e solo la tab visibile viene ridisegnata).
  stopDiag();
  if(diagData){ renderDiagPane(); } else { pane.appendChild(el('div','hintbox', t('diag_loading'))); }
  diagFetch();
  diagTimer=setInterval(diagFetch, DIAG_REFRESH_MS);
}

function renderDashboard(c){
  c.innerHTML='';
  c.appendChild(titleEl(t('dashboard')));

  const tabs=el('div','diag-tabs');
  const TABDEF=[['input',t('dash_input')],['holding',t('dash_holding')],
                ['coils',t('dash_coils')],['discrete',t('dash_discrete')]];
  TABDEF.forEach(([k,lab])=>{
    const b=el('button','diag-tab'+(DASH.tab===k?' active':''));
    b.textContent=lab;
    b.onclick=()=>{ DASH.tab=k; DASH.sub=0; renderDashboard(c); };
    tabs.appendChild(b);
  });
  c.appendChild(tabs);

  const pane=el('div','form-card');
  c.appendChild(pane);

  if(DASH.timer){ clearInterval(DASH.timer); DASH.timer=null; }

  if(DASH.tab==='coils' || DASH.tab==='discrete'){
    dashRenderBits(pane, DASH.tab);
    DASH.timer=setInterval(()=>dashRenderBits(pane, DASH.tab), DASH_REFRESH_MS);
  } else {
    const subbar=el('div','diag-tabs');
    for(let s=0;s<4;s++){
      const sb=el('button','diag-tab'+(DASH.sub===s?' active':''));
      sb.textContent=(s*64)+'-'+(s*64+63);
      sb.onclick=()=>{ DASH.sub=s; renderDashboard(c); };
      subbar.appendChild(sb);
    }
    pane.appendChild(subbar);
    const grid=el('div'); pane.appendChild(grid);
    const legend=el('div','dash-legend');
    legend.innerHTML='<span class="dot-16"></span>'+t('dash_16bit')+
                     ' <span class="dot-float"></span>'+t('dash_float')+
                     ' <span class="dot-unused"></span>'+t('dash_unused');
    pane.appendChild(legend);
    dashRenderRegs(grid, DASH.tab, DASH.sub);
    DASH.timer=setInterval(()=>dashRenderRegs(grid, DASH.tab, DASH.sub), DASH_REFRESH_MS);
  }
}

function dashRenderBits(pane, area){
  fetch('/api/dashboard/bits?area='+area).then(r=>r.json()).then(j=>{
    pane.innerHTML='';
    const info=el('div','dash-info', area+' - '+j.count+' bit');
    pane.appendChild(info);
    const g=el('div','bitgrid');
    (j.bits||[]).forEach((b,i)=>{
      const cell=el('div','bitcell '+(b?'bit-on':'bit-off'), String(i));
      cell.title=i+': '+b;
      g.appendChild(cell);
    });
    pane.appendChild(g);
  }).catch(()=>{});
}

function dashRenderRegs(grid, area, sub){
  const start=sub*64;
  fetch('/api/dashboard/regs?area='+area+'&start='+start+'&count=64')
    .then(r=>r.json()).then(j=>{
      grid.innerHTML='';
      const g=el('div','reggrid');
      (j.vals||[]).forEach((v,i)=>{
        const use=(j.use&&j.use[i])||0;
        const cls=use===1?'reg use16':use===2?'regfloat':'regunused';
        const cell=el('div','reg '+cls);
        cell.innerHTML='<span class="regidx">'+(start+i)+'</span><span class="regval">'+v+'</span>';
        g.appendChild(cell);
      });
      grid.appendChild(g);
    }).catch(()=>{});
}
function renderPortForm(c, pi){

    g.appendChild(fieldInput('p_parity',t('parity'),p.parity,{select:[{value:0,label:t('parity_none')},{value:1,label:t('parity_odd')},{value:2,label:t('parity_even')}]}));

// Cambio ruolo di una porta dal selettore. Se il nuovo ruolo scarta i device
// gia' configurati (master -> slave/none), chiede conferma e li elimina.
async function changePortRole(pi, newRole){
  const p=M.ports[pi]; const target=TARGETS[pi];
  if(p.role===newRole) return;
  const devs=M.devices[target]||[];
  const losingDevices = (p.role==='master' && newRole!=='master' && devs.length>0);
  if(losingDevices){
    if(!(await confirmModal(t('role_change_warn').replace('%n', devs.length), {danger:true}))) return;
    // Elimina i device della porta (e con loro i blocchi) prima del cambio.
    for(const d of [...devs]){
      try{ await api('DELETE','/api/device?target='+target+'&id='+d.id); }catch(e){}
    }
    await loadDevices(target);
  }
  p.role=newRole;
  renderPortForm(document.getElementById('content'), pi);
  renderTree();
}
async function savePort(pi){
  const p=M.ports[pi]; const target=TARGETS[pi];
  const body={ role:p.role };
  if(p.role!=='none'){

  // Pulisco DOPO l'await e prima di appendere: se due render async si accavallano

  // precedente invece di aggiungerne una seconda. Tutti gli append stanno dopo
  // questa riga, titolo compreso, altrimenti verrebbero cancellati.
  c.innerHTML='';
  c.appendChild(titleEl(t('wifi')));
  // Editabile solo in STATO AP (portale di config). Il gateway ce lo dice
  // direttamente via 'ap_mode', cosi' il frontend non deve conoscere la subnet
  // dell'AP (che puo' cambiare nei define lato firmware).
  const onAP = w.ap_mode === true;
  const card=el('div','form-card');
  const g=el('div','grid2');
  g.appendChild(fieldInput('w_ssid','SSID', w.ssid||'', {span2:true}));
  g.appendChild(fieldInput('w_pass',t('password'), '', {type:'password',span2:true}));
  card.appendChild(g);
  if(!onAP){
    const hb=el('div','hintbox'); hb.textContent=t('wifi_ap_only'); card.appendChild(hb);
    // campi in sola lettura
    card.querySelectorAll('input').forEach(i=>i.disabled=true);
  }else{
    const act=el('div','actions');
    const scan=el('button','btn ghost',t('wifi_scan')); scan.onclick=scanWifi; act.appendChild(scan);
    const save=el('button','btn',t('save')); save.onclick=saveWifi; act.appendChild(save);
    card.appendChild(act);
    // Contenitore dove scanWifi() inserisce la lista delle reti trovate.
    const scanBox=el('div'); scanBox.id='wifi_scan_box'; scanBox.style.marginTop='8px';
    card.appendChild(scanBox);
  }
  c.appendChild(card);
  const st=el('div','hintbox');
  st.textContent=(w.sta_connected? t('connected'): t('not_connected'))+(w.ap_ssid? ' \u00b7 AP: '+w.ap_ssid:'');
  c.appendChild(st);
  attachPasswordToggles();
}

async function scanWifi(){
  const box=document.getElementById('wifi_scan_box');
  if(!box) return;
  box.innerHTML=''; 
  const wait=el('div','hintbox'); wait.textContent=t('wifi_scanning'); box.appendChild(wait);
  let r={nets:[]};
  try{ r=await api('GET','/api/wifi/scan'); }
  catch(e){ box.innerHTML=''; const er=el('div','hintbox'); er.textContent=t('wifi_scan_err'); box.appendChild(er); return; }
  box.innerHTML='';
  const nets=(r&&r.nets)?r.nets:[];
  if(nets.length===0){ const em=el('div','hintbox'); em.textContent=t('wifi_scan_empty'); box.appendChild(em); return; }
  // Lista cliccabile: al click riempie il campo SSID col nome ESATTO (niente

  const list=el('div');
  nets.forEach(nw=>{

    row.textContent=(nw.ssid||'(?)')+lock+'   '+nw.rssi+' dBm';
    row.onclick=()=>{ const f=document.getElementById('w_ssid'); if(f){ f.value=nw.ssid; f.focus(); } };

async function loadEventLog(){
  const box=document.getElementById('evlog_box');
  if(!box) return;
  box.textContent=t('loading')||'...';
  try{
    const rows=await api('GET','/api/eventlog');
    if(!rows || !rows.length){ box.textContent=t('evlog_empty')||'—'; return; }
    // Costruisco una tabella. Colori per livello: 2=error rosso, 1=warn giallo,
    // 0/altri verde. Uso classi CSS gia' esistenti se presenti, con fallback
    // inline. Colonne: ora, messaggio.
    const tbl=el('table','evlog-table');
    tbl.style.width='100%'; tbl.style.borderCollapse='collapse';
    rows.forEach(r=>{
      const tr=el('tr');
      // colore in base al livello
      let color = '#1f9d55';                  // verde (info/altri)
      if(r.lv===2) color='#e3342f';           // rosso (error)
      else if(r.lv===1) color='#f2a900';      // giallo (warning)
      tr.style.borderLeft='4px solid '+color;
      // Ora: se ts valido (>0) mostro data/ora locale, altrimenti uptime.
      let when;
      if(r.ts && r.ts>0){
        const d=new Date(r.ts*1000);
        const loc=LANG_LOCALE[curLang]||'en-GB';
        try{
          when=new Intl.DateTimeFormat(loc,{year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
        }catch(e){ when=d.toISOString().substr(0,19).replace('T',' '); }
      } else {
        // uptime in s
        when='+'+Math.floor((r.up||0)/1000)+'s';
      }
      const tdW=el('td'); tdW.textContent=when;
      tdW.style.cssText='padding:4px 8px;white-space:nowrap;color:#666;font-size:12px;vertical-align:top';
      const tdM=el('td'); tdM.textContent=r.m||'';
      tdM.style.cssText='padding:4px 8px;font-size:13px';
      tr.appendChild(tdW); tr.appendChild(tdM);
      tbl.appendChild(tr);
    });
    box.innerHTML=''; box.appendChild(tbl);
  }catch(e){
    box.textContent=t('load_err')||'Error';
  }
}

  const card=el('div','form-card');

  // Server NTP
  g.appendChild(fieldInput('ntp_server', t('ntp_server'), '', {}));

  g.appendChild(fieldInput('log_persist', t('log_persist'), '0',
    {select:[{value:'1',label:t('yes')},{value:'0',label:t('no')}]}));
  card.appendChild(g);

  // Timezone: input con datalist per ricerca incrementale (le prime lettere
  // filtrano). Mostra il nome zona; salviamo la stringa POSIX corrispondente.
  const tzWrap=el('div','f span2');
  tzWrap.appendChild(el('label',null,t('ntp_timezone')));
  const tzInput=el('input','input'); tzInput.id='ntp_tz_name';
  tzInput.setAttribute('list','tzlist');
  tzInput.setAttribute('placeholder', t('ntp_tz_placeholder'));
  const dl=el('datalist'); dl.id='tzlist';
  TIMEZONES.forEach(z=>{ const o=el('option'); o.value=z.name; dl.appendChild(o); });
  tzWrap.appendChild(tzInput);
  tzWrap.appendChild(dl);
  card.appendChild(tzWrap);

  const act=el('div','actions');
  const save=el('button','btn',t('save')); save.onclick=saveSettings; act.appendChild(save);
  card.appendChild(act);
  c.appendChild(card);

  // Carico la config NTP corrente dal gateway.
  api('GET','/api/ntp').then(n=>{
    document.getElementById('ntp_en').value = n.enabled? '1':'0';
    document.getElementById('ntp_server').value = n.server||'';
    // Uso il NOME zona salvato (tz_name): la stringa POSIX non e' univoca (piu'
    // zone la condividono), quindi ricavare il nome dalla POSIX darebbe la prima
    // occorrenza sbagliata. Se tz_name manca (config vecchia), ripiego sul find.
    let name = n.tz_name || '';
    if(!name){
      const found = TIMEZONES.find(z=>z.tz===n.tz);
      name = found? found.name : (n.tz||'');
    }
    document.getElementById('ntp_tz_name').value = name;
    document.getElementById('log_persist').value = n.log_persist? '1':'0';
  }).catch(()=>{});
}
async function saveSettings(){
  const enabled = document.getElementById('ntp_en').value==='1';
  const server = document.getElementById('ntp_server').value.trim();
  const tzName = document.getElementById('ntp_tz_name').value.trim();
  // Converto il nome zona nella stringa POSIX. Se l'utente ha digitato qualcosa
  // che non e' in elenco, provo a usarlo com'e' (potrebbe essere una POSIX diretta).
  const z = TIMEZONES.find(x=>x.name===tzName);
  const tz = z? z.tz : tzName;
  const logPersist = document.getElementById('log_persist').value==='1';
  try{
    // Invio sia la POSIX (che il firmware usa) sia il nome IANA (che la UI
    // rilegge al reload, perche' la POSIX non e' univoca).
    await api('PUT','/api/ntp',{enabled:enabled, server:server, tz:tz, tz_name:tzName, log_persist:logPersist});
    toast(t('saved')||'OK');
  }catch(e){ toast(t('save_err')||'Errore', true); }
}

async function doReboot(){

  if(!ok) return;
  try{ await api('POST','/api/reboot'); }catch(e){ /* la connessione cade: atteso */ }

function rebootCountdown(sec){
  const box=document.getElementById('modalBox');
  const ov=document.getElementById('modalOv');
  box.className='modal-box';
  const tick=()=>{
    box.innerHTML='';
    box.appendChild(el('div','modal-title',t('rebooting')));
    box.appendChild(el('div','modal-msg', t('reboot_wait').replace('%s', sec)));
    ov.className='modal-ov on';
    if(sec<=0){ ov.className='modal-ov'; show('loginView'); return; }
    sec--; setTimeout(tick,1000);
  };
  tick();
}
function renderFirmware(c){
  c.appendChild(titleEl(t('firmware_upgrade')));

  // Info versione/partizione corrente (da /api/ota/status).
  const info=el('div','form-card');
  const infoBody=el('div'); infoBody.textContent='...';
  info.appendChild(infoBody);
  c.appendChild(info);
  fetch('/api/ota/status')
    .then(r=>r.json()).then(j=>{
      infoBody.innerHTML='';
      const mk=(k,v)=>{ const d=el('div'); d.innerHTML='<b>'+k+':</b> '+v; return d; };
      infoBody.appendChild(mk(t('firmware_current'), j.app_version||'?'));
      infoBody.appendChild(mk(t('firmware_partition'), j.running_partition||'?'));
    }).catch(()=>{ infoBody.textContent='—'; });

  // Avviso importante.
  const warn=el('div','hintbox'); warn.style.borderColor='#c0392b'; warn.textContent=t('firmware_warn');
  c.appendChild(warn);

  // --- Modo 1: upload file ---
  const card=el('div','form-card');
  card.appendChild(el('div','hintbox', t('firmware_hint')));
  const lbl=el('div','f span2'); lbl.appendChild(el('label',null,t('firmware_file'))); card.appendChild(lbl);
  card.appendChild(filePicker('fw_file','.bin'));

  // Barra di progresso (nascosta finche' non parte l'upload).
  const progWrap=el('div'); progWrap.style.display='none'; progWrap.style.margin='10px 0';
  const progBar=el('div'); progBar.style.height='10px'; progBar.style.background='var(--accent,#2d7)'; progBar.style.width='0%'; progBar.style.borderRadius='5px'; progBar.style.transition='width .2s';
  const progOuter=el('div'); progOuter.style.background='var(--border,#ccc)'; progOuter.style.borderRadius='5px'; progOuter.style.overflow='hidden'; progOuter.appendChild(progBar);
  const progTxt=el('div'); progTxt.style.fontSize='12px'; progTxt.style.marginTop='4px';
  progWrap.appendChild(progOuter); progWrap.appendChild(progTxt);
  card.appendChild(progWrap);

  const act=el('div','actions');
  const btn=el('button','btn',t('firmware_upload_btn'));
  act.appendChild(btn);
  card.appendChild(act);
  c.appendChild(card);

  btn.onclick=()=>{
    const fi=document.getElementById('fw_file');
    if(!fi || !fi.files || !fi.files[0]){ toast(t('firmware_file')); return; }
    const file=fi.files[0];
    btn.disabled=true; progWrap.style.display='block';
    progTxt.textContent=t('firmware_uploading');

    // XHR per avere il progress dell'upload (fetch non lo espone bene).
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/ota/upload');
    xhr.upload.onprogress=(e)=>{
      if(e.lengthComputable){
        const pct=Math.round(e.loaded*100/e.total);
        progBar.style.width=pct+'%';
        progTxt.textContent=t('firmware_uploading')+' '+pct+'%';
      }
    };
    xhr.onload=()=>{
      if(xhr.status>=200 && xhr.status<300){
        progBar.style.width='100%';
        progTxt.textContent=t('firmware_reboot');
        toast(t('firmware_reboot'));
      } else {
        let m=t('firmware_failed');
        try{ const j=JSON.parse(xhr.responseText); if(j.error) m+=': '+j.error; }catch(e){}
        progTxt.textContent=m; toast(m); btn.disabled=false;
      }
    };
    xhr.onerror=()=>{ progTxt.textContent=t('firmware_failed'); btn.disabled=false; };
    xhr.send(file);
  };

  // --- Modo 2: download da URL ---
  const card2=el('div','form-card');
  card2.appendChild(el('div','hintbox', t('firmware_url_hint')));
  const lbl2=el('div','f span2'); lbl2.appendChild(el('label',null,t('firmware_url'))); card2.appendChild(lbl2);
  const urlIn=el('input'); urlIn.type='text'; urlIn.placeholder='http://...'; urlIn.className='f span2';
  card2.appendChild(urlIn);
  const act2=el('div','actions');
  const btn2=el('button','btn',t('firmware_url_btn'));
  act2.appendChild(btn2); card2.appendChild(act2);
  c.appendChild(card2);

  btn2.onclick=()=>{
    const url=urlIn.value.trim();
    if(!url){ toast(t('firmware_url')); return; }
    btn2.disabled=true; toast(t('firmware_uploading'));
    fetch('/api/ota/url',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:url})
    }).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{
      if(ok){ toast(t('firmware_reboot')); }
      else { toast(t('firmware_failed')+(j.error?': '+j.error:'')); btn2.disabled=false; }
    }).catch(()=>{ toast(t('firmware_failed')); btn2.disabled=false; });
  };
}

let footerTimer=null;
function startFooter(){ stopFooter(); pollFooter(); footerTimer=setInterval(pollFooter, 30000); tickClock(); }
function stopFooter(){ if(footerTimer){ clearInterval(footerTimer); footerTimer=null; } }
async function pollFooter(){
  // Se la sessione e' scaduta localmente, NON chiamare l'API: vai al login.
  if(sessionExpiredLocally()){ handleSessionExpired(); return; }
  try{
    const s=await api('GET','/api/appstate');
    // Costruisco una riga di stato con le metriche di sistema.
    const parts=[];
    if(s.fw_version) parts.push('v'+s.fw_version);
    if(typeof s.cpu_load==='number' && s.cpu_load>=0) parts.push('CPU '+s.cpu_load+'%');
    if(typeof s.heap_free==='number') parts.push('RAM '+Math.round(s.heap_free/1024)+'KB');
    if(typeof s.uptime_s==='number') parts.push('up '+fmtUptime(s.uptime_s));
    parts.push(s.sta_connected? 'STA \u2713':'STA \u2717');
    document.getElementById('fmsg').textContent=parts.join('  \u00b7  ');
    const dot=document.getElementById('fdot');
    // colore: verde se RAM ok, ambra se poca RAM libera
    const lowRam = (typeof s.heap_free==='number' && s.heap_free < 20000);
    dot.className='dot'+(lowRam?' warn':'');
    // Ora dal gateway: parso "local_time" (YYYY-MM-DD HH:MM, gia' locale) in
    // minuti dalla mezzanotte, cosi' il clock avanza al minuto senza interrogare
    // il gateway ogni volta.
    if(s.time_synced && s.local_time){
      const m = s.local_time.match(/(\d{2}):(\d{2})$/);
      if(m){
        CLOCK.baseLocalMin = parseInt(m[1],10)*60 + parseInt(m[2],10);
        CLOCK.recvMs = Date.now();
        CLOCK.synced = true;
      }
    } else {
      CLOCK.synced = false;
    }
    renderClock();
  }catch(e){
    document.getElementById('fmsg').textContent=t('offline')||'offline';
    document.getElementById('fdot').className='dot err';
  }
}
function fmtUptime(sec){
  sec=Math.floor(sec);
  const d=Math.floor(sec/86400); sec%=86400;
  const h=Math.floor(sec/3600); sec%=3600;
  const m=Math.floor(sec/60);
  if(d>0) return d+'d '+h+'h';
  if(h>0) return h+'h '+m+'m';
  return m+'m';
}
// Clock del footer: mostra l'ora LOCALE del gateway (gia' calcolata dal firmware
// con la timezone POSIX), formattata per lingua, SENZA secondi, aggiornata al
// minuto. Il gateway invia "local_time" come "YYYY-MM-DD HH:MM"; qui mostriamo
// HH:MM riformattato secondo il locale della lingua. Avanza localmente al minuto.
const CLOCK = { baseLocalMin:0, recvMs:0, synced:false };
const LANG_LOCALE = { it:'it-IT', en:'en-GB', fr:'fr-FR', es:'es-ES', de:'de-DE' };
function renderClock(){
  const c=document.getElementById('fclock');
  if(!c) return;
  if(!CLOCK.synced){
    c.textContent = t('time_nosync') || '--:--';
    return;
  }
  // Minuti locali trascorsi dalla ricezione, sommati all'ora base ricevuta.
  const elapsedMin = Math.floor((Date.now() - CLOCK.recvMs)/60000);
  let totMin = CLOCK.baseLocalMin + elapsedMin;
  const hh = Math.floor(totMin/60) % 24;
  const mm = totMin % 60;
  // Formattazione HH:MM 24h per lingua (tutte 24h, EN->en-GB): il separatore e'
  // ':' in tutti i locale target, quindi zero-pad semplice.
  c.textContent = String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
let clockTimer=null;
function tickClock(){
  renderClock();
  if(clockTimer) clearInterval(clockTimer);
  clockTimer=setInterval(renderClock, 60000);
}
